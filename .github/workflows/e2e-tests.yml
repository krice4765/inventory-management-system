name: E2E Tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

defaults:
  run:
    working-directory: web_projects/web_dev/project1

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web_projects/web_dev/project1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env.test file
        run: |
          cat << EOF > .env.test
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TEST_USER_EMAIL=${{ secrets.E2E_TEST_USER_EMAIL }}
          TEST_USER_PASSWORD=${{ secrets.E2E_TEST_USER_PASSWORD }}
          TEST_ADMIN_EMAIL=${{ secrets.E2E_TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD=${{ secrets.E2E_TEST_ADMIN_PASSWORD }}
          EOF

      - name: Run E2E tests
        run: npm run test:e2e
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-videos
          path: test-results/
          retention-days: 7
